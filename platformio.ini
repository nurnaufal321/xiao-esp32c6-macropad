; PlatformIO Project Configuration File
; Target: Seeed Studio XIAO ESP32C6 (RISC-V)
; Uses built-in ESP32 Arduino Core 3.x BLE / BLEHIDDevice library (Zero external dependencies!)

[platformio]
src_dir = firmware/xiao_c6_macropad

[env:seeed_xiao_esp32c6]
platform = file:///Users/naufal/.platformio/platforms/espressif32@src-a19e5be5b0134b0dadd3fdbe3ef75b63
board = seeed_xiao_esp32c6
framework = arduino

; Point to locally installed RISC-V toolchain & esptool so PlatformIO builds 100% offline
platform_packages =
    toolchain-riscv32-esp @ file:///Users/naufal/Library/Arduino15/packages/esp32/tools/esp-rv32/2511
    tool-esptoolpy @ file:///Users/naufal/.gemini/antigravity/scratch/xiao-esp32c6-macropad/.local_tools/esptoolpy

; Serial Monitor & Upload Configuration (USB-C native CDC/JTAG serial)
monitor_speed = 115200
upload_port = /dev/cu.usbmodem1111401
monitor_port = /dev/cu.usbmodem1111401

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
